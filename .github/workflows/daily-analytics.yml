name: Daily Analytics Tracking

on:
  schedule:
    # Runs every day at 9:00 AM UTC
    # UTC timezone guide:  EST = UTC-5  |  PST = UTC-8  |  CST = UTC-6
    # 9:00 AM UTC = 4:00 AM EST / 1:00 AM PST
    # To adjust: change the hour value (0–23 in UTC)
    # Example: '0 14 * * *' = 9:00 AM EST / 6:00 AM PST
    - cron: '0 9 * * *'

  # Allows you to trigger this workflow manually from the GitHub Actions UI
  # Useful for testing and for re-running if the scheduled run failed
  workflow_dispatch:

jobs:
  fetch-analytics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          # Point npm cache at the analytics subdirectory's lockfile
          cache-dependency-path: analytics/package-lock.json

      - name: Install dependencies
        working-directory: ./analytics
        run: npm ci

      - name: Run analytics script
        working-directory: ./analytics
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_NAME: 'RUBIES SEO Tracker'
          SEARCH_CONSOLE_SITE_URL: 'https://rubyshines.com'
          SERVICE_ACCOUNT_KEY: ${{ secrets.SERVICE_ACCOUNT_KEY }}
        run: |
          # Write the service account credentials to a temporary file
          # The secret contains the full JSON content of service-account-key.json
          echo '${{ secrets.SERVICE_ACCOUNT_KEY }}' > service-account-key.json

          # Build the .env file from environment variables
          cat > .env << EOF
          GA4_PROPERTY_ID=${GA4_PROPERTY_ID}
          GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID}
          GOOGLE_SHEET_NAME=${GOOGLE_SHEET_NAME}
          SERVICE_ACCOUNT_KEY_PATH=./service-account-key.json
          SEARCH_CONSOLE_SITE_URL=${SEARCH_CONSOLE_SITE_URL}
          EOF

          # Run the automation script
          npm run fetch-metrics

          # Clean up credentials so they're never stored in the runner's workspace
          rm -f service-account-key.json
          rm -f .env
