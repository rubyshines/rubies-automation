name: RUBIES Unfulfilled Orders Report

on:
  schedule:
    - cron: '0 10 * * *' # 10:00 UTC = 6am EDT / 5am EST
  workflow_dispatch:

jobs:
  run-unfulfilled-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run unfulfilled orders report
        env:
          # Core
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}

          # Shopify (order sync + pre-order detection)
          SHOPIFY_STORE_URL: ${{ secrets.SHOPIFY_STORE_URL }}
          SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          SHOPIFY_PASSWORD: ${{ secrets.SHOPIFY_PASSWORD }}

          # Warehance (hold detection + auto-resolve)
          WAREHANCE_API_KEY: ${{ secrets.WAREHANCE_API_KEY }}
          WAREHANCE_API_URL: ${{ secrets.WAREHANCE_API_URL }}

          # Google Maps (Street View for address hold resolution)
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

          # Anthropic (Claude Vision for address classification)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node reports/unfulfilled-orders-report.js
