name: RUBIES Daily Sync

on:
  schedule:
    - cron: '0 10 * * *' # 10:00 UTC = 6am EDT / 5am EST
  workflow_dispatch:

jobs:
  run-daily-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Write service account key
        run: echo '${{ secrets.SERVICE_ACCOUNT_KEY }}' > service-account-key.json

      - name: Run daily sync
        env:
          # Core
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}

          # SEO (Google Search Console + GA4)
          SERVICE_ACCOUNT_KEY_PATH: './service-account-key.json'
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          SEARCH_CONSOLE_SITE_URL: ${{ secrets.SEARCH_CONSOLE_SITE_URL }}

          # Shopify (products, inventory, orders, customers)
          SHOPIFY_STORE_URL: ${{ secrets.SHOPIFY_STORE_URL }}
          SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          SHOPIFY_PASSWORD: ${{ secrets.SHOPIFY_PASSWORD }}

          # Klaviyo (email tracking)
          KLAVIYO_API_KEY: ${{ secrets.KLAVIYO_API_KEY }}

          # Judge.me (reviews)
          JUDGEME_API_TOKEN: ${{ secrets.JUDGEME_API_TOKEN }}

          # Gorgias (conversations)
          GORGIAS_DOMAIN: ${{ secrets.GORGIAS_DOMAIN }}
          GORGIAS_API_KEY: ${{ secrets.GORGIAS_API_KEY }}
          GORGIAS_EMAIL: ${{ secrets.GORGIAS_EMAIL }}

          # Voyage AI (embeddings for conversation sync)
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}

          # QuickBooks Online (finance)
          QBO_CLIENT_ID: ${{ secrets.QBO_CLIENT_ID }}
          QBO_CLIENT_SECRET: ${{ secrets.QBO_CLIENT_SECRET }}
          QBO_REALM_ID: ${{ secrets.QBO_REALM_ID }}
        run: node daily-sync-all.js
