name: RUBIES Weekly SEO Digest

on:
  schedule:
    - cron: '15 10 * * 1' # Monday 10:15 UTC = ~5:15am ET
  workflow_dispatch:

jobs:
  run-weekly-seo-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run weekly SEO digest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SERVICE_ACCOUNT_KEY_PATH: './service-account-key.json'
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          SEARCH_CONSOLE_SITE_URL: ${{ secrets.SEARCH_CONSOLE_SITE_URL }}
          SHOPIFY_STORE_URL: ${{ secrets.SHOPIFY_STORE_URL }}
          SHOPIFY_PASSWORD: ${{ secrets.SHOPIFY_PASSWORD }}
        run: |
          echo '${{ secrets.SERVICE_ACCOUNT_KEY }}' > service-account-key.json
          node seo-tracking/weekly-seo-digest.js
