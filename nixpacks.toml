# Skip the apt-get chromium install that Nixpacks auto-adds when it
# detects puppeteer in package.json. The apt packages (chromium, snapd,
# X11 libs — ~420MB) are unnecessary because puppeteer bundles its own
# Chromium via npm. Removing them cuts build time and eliminates flaky
# Ubuntu mirror failures.

[phases.setup]
aptPkgs = []
