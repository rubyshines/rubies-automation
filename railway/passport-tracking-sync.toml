[build]
builder = "NIXPACKS"

[deploy]
startCommand = "apt-get update -qq && apt-get install -y -qq libnss3 libatk-bridge2.0-0 libdrm2 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64 libcups2 libxkbcommon0 libpango-1.0-0 libcairo2 libatspi2.0-0 > /dev/null 2>&1; node customer-service/sync/syncPassportDelivery.js --limit 50"
cronSchedule = "37 * * * *"
