<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>RUBIES Care</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#c0392b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <img src="/icons/icon-192.png" alt="RUBIES" class="header-logo">
    <h1>RUBIES Care</h1>
    <div id="stats-bar">
      <span id="stat-attention" class="stat stat-fixed">--</span>
    </div>
    <nav>
      <button class="tab active" data-tab="new" onclick="switchTab('new')">New <span class="tab-count" id="tab-count-new"></span></button>
      <button class="tab" data-tab="followup" onclick="switchTab('followup')">Follow-up <span class="tab-count" id="tab-count-followup"></span></button>
      <button class="tab" data-tab="parked" onclick="switchTab('parked')">Parked <span class="tab-count" id="tab-count-parked"></span></button>
      <button class="tab" data-tab="snoozed" onclick="switchTab('snoozed')">Snoozed <span class="tab-count" id="tab-count-snoozed"></span></button>
      <button class="tab" data-tab="closed" onclick="switchTab('closed')">Closed</button>
    </nav>
    <a href="/stats" class="btn-stats" title="Performance stats">Stats</a>
    <button id="btn-logout" class="btn-logout" onclick="logout()" title="Sign out">Sign out</button>
  </header>

  <main>
    <!-- Tickets panel (split: list + detail) — shared by all 4 ticket tabs -->
    <div id="panel-tickets" class="panel">
      <div class="sidebar">
        <!-- View 1: Queue list -->
        <div id="sidebar-queue">
          <div id="queue-items"></div>
        </div>
        <!-- View 2: Customer context (when draft selected) -->
        <div id="sidebar-context" style="display:none">
          <div class="sidebar-nav">
            <button class="sidebar-back" onclick="showSidebarQueue()">
              <span class="sidebar-back-arrow">&larr;</span>
              <span id="sidebar-back-count"></span>
            </button>
            <div class="sidebar-nav-arrows">
              <button class="nav-arrow" onclick="navigateTicket(-1)" title="Previous ticket (k)">&uarr;</button>
              <button class="nav-arrow" onclick="navigateTicket(1)" title="Next ticket (j)">&darr;</button>
            </div>
          </div>
          <div class="sidebar-context-inner">
            <div id="current-ticket-header"></div>
            <div id="ticket-order"></div>
            <div id="customer-card"></div>
            <details id="other-orders-section" class="context-details" style="display:none">
              <summary class="context-section-label">Order History <span id="other-orders-count" class="badge badge-muted"></span></summary>
              <div id="other-orders-list"></div>
            </details>
            <details id="prior-tickets-section" class="context-details" style="display:none" open>
              <summary class="context-section-label">Related Ticket</summary>
              <div id="prior-tickets-list"></div>
            </details>
            <details id="past-tickets-section" class="context-details" style="display:none">
              <summary class="context-section-label">Past Tickets <span id="past-tickets-count" class="badge badge-muted"></span></summary>
              <div id="past-tickets-list"></div>
            </details>
          </div>
        </div>
      </div>
      <div id="draft-detail" class="detail">
        <div id="detail-placeholder"></div>
        <div id="detail-content" style="display:none">

          <!-- Mobile: combined back + summary bar (one sticky row) -->
          <div id="mobile-header-bar" class="mobile-header-bar">
            <button id="mobile-back-btn" class="mobile-back-arrow" onclick="mobileBackToQueue()">&larr;</button>
            <div class="mobile-header-info" onclick="toggleSummaryExpand()">
              <div class="mobile-header-line1">
                <span id="summary-category" class="category-badge"></span>
                <span id="summary-status-dot" class="status-dot"></span>
                <span id="summary-name" class="summary-name"></span>
                <span id="summary-order" class="summary-order"></span>
              </div>
              <div id="summary-context" class="summary-context"></div>
            </div>
          </div>
          <div id="summary-expanded" class="summary-expanded" style="display:none">
            <div id="summary-expanded-content"></div>
          </div>
          <!-- Conversation thread -->
          <details id="detail-conversation" class="detail-section" open>
            <summary>Conversation</summary>
            <div id="conversation-thread"></div>
          </details>

          <!-- Action Panel (above draft — action informs the response) -->
          <div id="action-panel" style="display:none">
            <div id="action-panel-header"></div>
            <div class="action-chat-messages" id="action-chat-messages"></div>
            <div class="action-chat-input-row">
              <textarea class="action-chat-input" id="action-chat-input" rows="4"
                placeholder="e.g. exchange the AJ to size L, refund the Ruby..."
                onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendActionMessage()}"></textarea>
              <button class="action-chat-send" id="action-chat-send" onclick="sendActionMessage()">Send</button>
            </div>
            <div id="action-preview" style="display:none"></div>
            <div id="action-result" style="display:none"></div>
          </div>

          <!-- AI Draft (editable) -->
          <div id="detail-draft" class="detail-section">
            <h3>AI Draft <span id="detail-confidence" class="badge"></span> <span id="detail-status-badge" class="badge"></span></h3>
            <div class="steer-row">
              <input type="text" id="steer-input" class="steer-input"
                placeholder="redirect the advisor"
                onkeydown="if(event.key==='Enter'){event.preventDefault();refreshDraft(this.value)}else if(event.key==='Escape'){this.blur()}" />
              <button id="btn-refresh" class="btn-refresh-inline" onclick="refreshDraft(document.getElementById('steer-input').value)" title="Regenerate draft">&#8635;</button>
            </div>
            <div id="steer-last" class="steer-last" style="display:none"></div>
            <textarea id="draft-editor" rows="8"></textarea>
            <label for="draft-notes" class="label" style="margin-top:12px;display:block">Training Notes (optional)</label>
            <textarea id="draft-notes" placeholder="e.g. 'wrong size recommendation', 'tone too formal', 'nailed it'" rows="2"></textarea>
            <div id="draft-actions" class="draft-actions">
              <div class="btn-row btn-row-primary">
                <button id="btn-send" class="btn btn-primary" onclick="sendDraft('snooze')">Send &amp; Snooze</button>
                <button id="btn-send-close" class="btn btn-close" onclick="sendDraft('close')">Send &amp; Close</button>
              </div>
              <div class="btn-row btn-row-secondary">
                <button id="btn-close-only" class="btn btn-ghost" onclick="closeNoReply()">Close</button>
                <button id="btn-snooze-only" class="btn btn-ghost" onclick="snoozeNoReply()">Snooze</button>
                <button id="btn-park" class="btn btn-ghost" onclick="parkTicket()">Park</button>
                <button id="btn-unpark" class="btn btn-ghost" onclick="unparkTicket()" style="display:none">Unpark</button>
                <button id="btn-forward" class="btn btn-ghost" onclick="forwardTicket()">Forward</button>
                <span class="btn-row-divider"></span>
                <button id="btn-release" class="btn btn-ghost" onclick="releaseDraft()">Release</button>
                <button id="btn-spam" class="btn btn-ghost btn-ghost-danger" onclick="markSpam()">Spam</button>
                <button id="btn-delete" class="btn btn-ghost btn-ghost-danger" onclick="deleteDraft()">Delete</button>
              </div>
            </div>
          </div>


        </div>
      </div>
    </div>

  </main>

  <script src="/app.js"></script>
<div id="toast-container"></div>
<style>
#toast-container { position: fixed; top: 20px; right: 20px; z-index: 10000; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast { padding: 10px 18px; border-radius: 8px; font-size: 14px; font-weight: 500; color: #fff; opacity: 0; transform: translateX(40px); transition: opacity .25s, transform .25s; pointer-events: auto; }
.toast-visible { opacity: 1; transform: translateX(0); }
.toast-success { background: #16a34a; }
.toast-error   { background: #dc2626; }
.toast-info    { background: #2563eb; }
</style>

<!-- Attachment Lightbox -->
<div class="lightbox-overlay" id="lightbox">
  <button class="lightbox-close" id="lightbox-close">&times;</button>
  <button class="lightbox-nav prev" id="lightbox-prev">&lsaquo;</button>
  <button class="lightbox-nav next" id="lightbox-next">&rsaquo;</button>
  <div class="lightbox-content" id="lightbox-content"></div>
</div>
</body>
</html>
