<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RUBIES CS Draft Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <h1>RUBIES CS Drafts</h1>
    <div id="stats-bar">
      <span id="stat-pending" class="stat">-- pending</span>
      <span id="stat-rate" class="stat">-- acceptance</span>
      <span id="stat-edit" class="stat">-- avg edit</span>
      <span id="stat-last-poll" class="stat">last poll: --</span>
      <button id="btn-poll" onclick="triggerPoll()">Poll Now</button>
    </div>
    <nav>
      <button class="tab active" data-tab="queue" onclick="switchTab('queue')">Queue</button>
      <button class="tab" data-tab="history" onclick="switchTab('history')">History</button>
      <button class="tab" data-tab="test" onclick="switchTab('test')">Test</button>
    </nav>
  </header>

  <main>
    <!-- Queue panel (split: list + detail) -->
    <div id="panel-queue" class="panel">
      <div id="queue-list" class="sidebar">
        <div id="queue-items"></div>
      </div>
      <div id="draft-detail" class="detail">
        <div id="detail-placeholder">Select a draft to review</div>
        <div id="detail-content" style="display:none">
          <!-- Customer info -->
          <div id="detail-header" class="detail-section">
            <div id="detail-customer"></div>
            <div id="detail-order"></div>
          </div>

          <!-- Conversation thread -->
          <details id="detail-conversation" class="detail-section" open>
            <summary>Conversation</summary>
            <div id="conversation-thread"></div>
          </details>

          <!-- AI Draft (editable) -->
          <div id="detail-draft" class="detail-section">
            <h3>AI Draft <span id="detail-confidence" class="badge"></span> <span id="detail-status-badge" class="badge"></span></h3>
            <textarea id="draft-editor" rows="8"></textarea>
            <div id="draft-actions">
              <div id="action-panel" style="display:none">
                <div id="action-prescription"></div>
                <button id="btn-execute" class="btn btn-action" onclick="executeAction()">Execute Action</button>
                <div id="action-result" style="display:none"></div>
              </div>
              <label for="draft-notes" class="label" style="margin-top:12px;display:block">Training Notes (optional)</label>
              <textarea id="draft-notes" placeholder="e.g. 'wrong size recommendation', 'tone too formal', 'nailed it'" rows="2"></textarea>
              <div class="btn-row">
                <button id="btn-send" class="btn btn-primary" onclick="sendDraft('snooze')">Send Reply</button>
                <button id="btn-send-close" class="btn btn-close" onclick="sendDraft('close')">Send &amp; Close</button>
                <button id="btn-close-only" class="btn btn-dismiss" onclick="closeNoReply()">Close</button>
                <button id="btn-release" class="btn btn-secondary" onclick="releaseDraft()">Release to Gorgias</button>
              </div>
            </div>
          </div>

          <!-- Decision Path -->
          <details id="detail-audit" class="detail-section">
            <summary>Decision Path</summary>
            <div id="audit-trail"></div>
          </details>

          <!-- Context -->
          <details id="detail-context" class="detail-section">
            <summary>Context</summary>
            <div id="context-content"></div>
          </details>
        </div>
      </div>
    </div>

    <!-- History panel -->
    <div id="panel-history" class="panel" style="display:none">
      <table id="history-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Customer</th>
            <th>Order</th>
            <th>Type</th>
            <th>Status</th>
            <th>Edit Dist</th>
            <th>Notes</th>
          </tr>
        </thead>
        <tbody id="history-body"></tbody>
      </table>
    </div>
    <!-- Test panel -->
    <div id="panel-test" class="panel" style="display:none">
      <div class="test-layout">
        <!-- Test input -->
        <div class="test-input-section">
          <div class="detail-section">
            <h3 style="margin-bottom:12px">Test Scenario</h3>
            <div style="display:flex;gap:12px;margin-bottom:12px">
              <div style="flex:1">
                <label class="label">Customer Email</label>
                <input id="test-email" type="email" placeholder="customer@example.com" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);font-family:inherit;font-size:13px;background:var(--surface-inset)">
              </div>
              <div style="flex:1">
                <label class="label">Order # (optional)</label>
                <input id="test-order" type="text" placeholder="e.g. 29238" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);font-family:inherit;font-size:13px;background:var(--surface-inset)">
              </div>
            </div>
            <label class="label">Customer Messages (one per line, or paste a conversation)</label>
            <textarea id="test-messages" rows="4" placeholder="the AJ is too tight around the waist&#10;yes size 14 please" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);font-family:inherit;font-size:13px;background:var(--surface-inset);resize:vertical"></textarea>
            <div class="btn-row" style="margin-top:10px">
              <button class="btn btn-primary" onclick="runTest()">Run Test</button>
              <button class="btn btn-secondary" onclick="clearTest()">Clear</button>
            </div>
          </div>

          <!-- Replay section -->
          <div class="detail-section">
            <h3 style="margin-bottom:12px">Replay Gorgias Conversation</h3>
            <div style="display:flex;gap:12px;align-items:end">
              <div style="flex:1">
                <label class="label">Gorgias Ticket ID</label>
                <input id="test-ticket-id" type="text" placeholder="e.g. 90842753" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);font-family:inherit;font-size:13px;background:var(--surface-inset)">
              </div>
              <button class="btn btn-action" onclick="replayTicket()">Replay</button>
            </div>
          </div>
        </div>

        <!-- Test results -->
        <div class="test-results-section">
          <div id="test-placeholder" class="detail-section" style="text-align:center;color:var(--text-tertiary);padding:40px">
            Run a test or replay a conversation to see results
          </div>
          <div id="test-results" style="display:none"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
