<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Receipts · RUBIES</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#faf9f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Receipts">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/receipts.css">
</head>
<body>

<header class="rc-header">
  <img src="/icons/icon-192.png" alt="RUBIES" class="rc-logo">
  <h1>Receipts</h1>
  <div class="rc-header-totals" id="header-totals"></div>
  <nav class="rc-header-nav">
    <a href="/">Tickets</a>
    <a href="/stats">Stats</a>
  </nav>
</header>

<main class="rc-main">

  <!-- ── Capture ─────────────────────────────────────────────── -->
  <section class="capture" id="capture">
    <label class="capture-drop" id="capture-drop">
      <!-- No `capture` attribute here on purpose: on iOS that would force the
           camera and remove "Photo Library", which is the wrong default for a
           receipt photographed earlier. The FAB below is the straight-to-camera
           path. -->
      <!-- `multiple` so a long receipt already shot in sections can be picked
           in one go from the library. -->
      <input type="file" id="file-input" accept="image/*" multiple hidden>
      <span class="capture-icon" aria-hidden="true">
        <svg viewBox="0 0 32 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
          <path d="M2 7.5h5.5L9.5 4h13l2 3.5H30v14H2z"/>
          <circle cx="16" cy="14" r="5"/>
        </svg>
      </span>
      <span class="capture-copy">
        <strong>Capture a receipt</strong>
        <em>Snap it. Everything else is read for you.</em>
      </span>
      <span class="capture-hint">JPEG · PNG · HEIC</span>
    </label>

    <!-- The way INTO a multi-section capture. It has to live out here, outside
         the tray: the tray only exists once it holds a photo, and a single shot
         submits immediately, so an "add another" button inside it can never be
         reached from the camera — which is the whole point on a phone. -->
    <div class="capture-alt" id="capture-alt">
      <button class="capture-alt-btn" id="capture-sections" type="button">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <rect x="2.5" y="4.5" width="9" height="13" rx="1"/>
          <path d="M6 2.5h9a1 1 0 0 1 1 1v11"/>
        </svg>
        Longer than one photo? Capture it in sections
      </button>
    </div>

    <!-- Page tray: a long receipt gets photographed in sections, and they are
         held here until submitted together as ONE receipt. Hidden until the
         first shot lands, so the single-photo flow is untouched. -->
    <div class="tray" id="tray" hidden>
      <div class="tray-head">
        <strong id="tray-count"></strong>
        <span class="tray-hint">Sections of one long receipt. Overlap is fine — repeated lines are only counted once.</span>
      </div>
      <div class="tray-pages" id="tray-pages"></div>
      <div class="tray-actions">
        <button class="btn btn-secondary" id="tray-add" type="button">Add another section</button>
        <button class="btn btn-primary" id="tray-submit" type="button">Read receipt</button>
        <button class="btn-ghost" id="tray-discard" type="button">Discard</button>
      </div>
    </div>

    <!-- The scan panel: shown while a photo is being read. This is the one
         moment the operator actually waits on, so it shows the photo with a
         sweep across it rather than a spinner over nothing. -->
    <div class="scan" id="scan" hidden>
      <div class="scan-frame">
        <img id="scan-preview" alt="">
        <div class="scan-beam"></div>
      </div>
      <div class="scan-status">
        <span class="scan-label" id="scan-label">Reading the receipt</span>
        <span class="scan-steps" id="scan-steps"></span>
      </div>
      <button class="btn-ghost" id="scan-cancel" type="button">Cancel</button>
    </div>

    <div class="capture-error" id="capture-error" hidden></div>
  </section>

  <!-- ── Ledger ──────────────────────────────────────────────── -->
  <section class="ledger-wrap">
    <div class="ledger-controls">
      <div class="filters" id="filters">
        <button class="chip is-active" data-status="">All</button>
        <button class="chip" data-status="needs_review">To review</button>
        <button class="chip" data-status="confirmed">Confirmed</button>
        <button class="chip" data-status="rejected">Rejected</button>
      </div>
      <div class="ledger-tools">
        <input type="search" id="search" placeholder="merchant, category, account…" autocomplete="off">
        <button class="btn-ghost" id="confirm-clean" type="button" hidden></button>
      </div>
    </div>

    <div class="ledger" id="ledger">
      <div class="ledger-empty" id="ledger-empty">Loading the ledger…</div>
    </div>
  </section>
</main>

<!-- ── Detail: the receipt itself ─────────────────────────────── -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-scrim" id="sheet-scrim"></div>
  <div class="sheet-body" role="dialog" aria-modal="true" aria-label="Receipt detail">
    <button class="sheet-close" id="sheet-close" type="button" aria-label="Close">&times;</button>
    <div class="sheet-content" id="sheet-content"></div>
  </div>
</div>

<div class="lightbox" id="lightbox" hidden>
  <img id="lightbox-img" alt="Receipt photo">
</div>

<!-- Thumb-reach capture on phones (hidden on desktop by CSS). `capture` sends
     iOS straight to the rear camera with no picker in between. -->
<input type="file" id="camera-input" accept="image/*" capture="environment" hidden>
<button class="fab" id="fab" type="button" aria-label="Take a photo of a receipt">
  <svg viewBox="0 0 32 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
    <path d="M2 7.5h5.5L9.5 4h13l2 3.5H30v14H2z"/>
    <circle cx="16" cy="14" r="5"/>
  </svg>
</button>

<div class="toast" id="toast" hidden></div>

<script src="/receipts.js"></script>
</body>
</html>
